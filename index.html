<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>電話番号チェッカー</title>
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="番号チェック">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root {
    --bg: #f6f7f8; --card: #fff; --text: #1a1d21; --muted: #6b7280;
    --line: #e5e7eb; --accent: #0f766e; --accent-soft: #e6f4f2;
    --warn: #b45309; --warn-soft: #fef3e2; --danger: #b91c1c; --danger-soft: #fdecec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111315; --card: #1b1e21; --text: #eceef0; --muted: #9aa1a9;
      --line: #2c3035; --accent: #2dd4bf; --accent-soft: #11302c;
      --warn: #fbbf24; --warn-soft: #33270f; --danger: #f87171; --danger-soft: #3a1717;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px);
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 16px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .02em; }
  .icon-btn {
    background: none; border: 1px solid var(--line); color: var(--text);
    border-radius: 10px; padding: 8px 12px; font-size: 14px;
  }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
  label.small { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  textarea, input[type=text], input[type=password], select {
    width: 100%; font-size: 17px; padding: 12px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); font-family: inherit;
  }
  textarea { min-height: 64px; resize: vertical; }
  .row { display: flex; gap: 10px; margin-top: 12px; }
  .btn {
    flex: 1; border: none; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 600;
    background: var(--accent); color: #fff;
  }
  @media (prefers-color-scheme: dark) { .btn { color: #062a26; } }
  .btn.secondary { background: var(--accent-soft); color: var(--accent); }
  .btn:disabled { opacity: .5; }
  .preview { margin-top: 12px; display: none; position: relative; }
  .preview img { max-width: 100%; max-height: 220px; border-radius: 10px; border: 1px solid var(--line); display: block; }
  .preview button { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,.6); color: #fff; border: none; border-radius: 999px; padding: 4px 10px; font-size: 13px; }
  .result-main { font-size: 20px; font-weight: 700; line-height: 1.45; margin: 4px 0 10px; }
  .num { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .badge { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.danger { background: var(--danger-soft); color: var(--danger); }
  .detail { font-size: 15px; line-height: 1.7; white-space: pre-wrap; }
  .sources { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  .sources a { display: block; font-size: 13px; color: var(--accent); text-decoration: none; padding: 4px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .links a { font-size: 13px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); color: var(--text); text-decoration: none; }
  .muted { color: var(--muted); font-size: 13px; line-height: 1.6; }
  .err { color: var(--danger); font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
  .spinner { width: 22px; height: 22px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #settings { display: none; }
  .hist-item { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .hist-item:last-child { border-bottom: none; }
  .hist-item b { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📞 電話番号チェッカー</h1>
    <button class="icon-btn" id="toggleSettings">設定</button>
  </header>

  <section class="card" id="settings">
    <label class="small" for="apiKey">Gemini APIキー（この端末にだけ保存されます）</label>
    <input type="password" id="apiKey" placeholder="AIza..." autocomplete="off">
    <label class="small" for="model" style="margin-top:12px">モデル</label>
    <select id="model">
      <option value="gemini-2.5-flash">gemini-2.5-flash（おすすめ）</option>
      <option value="gemini-2.5-flash-lite">gemini-2.5-flash-lite（速い・軽い）</option>
      <option value="custom">その他（手入力）</option>
    </select>
    <input type="text" id="customModel" placeholder="例: gemini-3-flash-preview" style="margin-top:8px; display:none">
    <div class="row">
      <button class="btn" id="saveSettings">保存</button>
    </div>
    <p class="muted">キーは <a href="https://aistudio.google.com/apikey" style="color:var(--accent)">Google AI Studio</a> で発行できます。</p>
  </section>

  <section class="card">
    <label class="small" for="input">電話番号を入力・貼り付け（スクショも貼り付けOK）</label>
    <textarea id="input" placeholder="例: 03-1234-5678" inputmode="tel"></textarea>
    <div class="preview" id="preview">
      <img id="previewImg" alt="">
      <button id="clearImg">✕ 画像を外す</button>
    </div>
    <input type="file" id="file" accept="image/*" hidden>
    <div class="row">
      <button class="btn secondary" id="pickImg">🖼 スクショを選ぶ</button>
      <button class="btn" id="go">調べる</button>
    </div>
  </section>

  <section class="card" id="resultCard" style="display:none">
    <div id="result"></div>
  </section>

  <section class="card" id="histCard" style="display:none">
    <label class="small">最近調べた番号</label>
    <div id="hist"></div>
  </section>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  // ---------- Settings ----------
  const apiKeyEl = $('apiKey'), modelEl = $('model'), customModelEl = $('customModel');
  function loadSettings() {
    apiKeyEl.value = store.get('apiKey', '');
    const m = store.get('model', 'gemini-2.5-flash');
    if ([...modelEl.options].some(o => o.value === m)) { modelEl.value = m; }
    else { modelEl.value = 'custom'; customModelEl.value = m; }
    customModelEl.style.display = modelEl.value === 'custom' ? 'block' : 'none';
    $('settings').style.display = apiKeyEl.value ? 'none' : 'block';
  }
  modelEl.addEventListener('change', () => {
    customModelEl.style.display = modelEl.value === 'custom' ? 'block' : 'none';
  });
  $('toggleSettings').addEventListener('click', () => {
    const s = $('settings');
    s.style.display = s.style.display === 'block' ? 'none' : 'block';
  });
  $('saveSettings').addEventListener('click', () => {
    store.set('apiKey', apiKeyEl.value.trim());
    store.set('model', modelEl.value === 'custom' ? customModelEl.value.trim() : modelEl.value);
    $('settings').style.display = 'none';
  });
  const currentModel = () => store.get('model', 'gemini-2.5-flash') || 'gemini-2.5-flash';

  // ---------- Image handling ----------
  let image = null; // { mime, data(base64) }
  async function setImageFromBlob(blob) {
    const dataUrl = await shrink(blob, 1600);
    image = { mime: 'image/jpeg', data: dataUrl.split(',')[1] };
    $('previewImg').src = dataUrl;
    $('preview').style.display = 'block';
  }
  function shrink(blob, max) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => {
        let { width: w, height: h } = img;
        const scale = Math.min(1, max / Math.max(w, h));
        w = Math.round(w * scale); h = Math.round(h * scale);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = (e) => { URL.revokeObjectURL(url); reject(e); };
      img.src = url;
    });
  }
  $('pickImg').addEventListener('click', () => $('file').click());
  $('file').addEventListener('change', (e) => {
    const f = e.target.files && e.target.files[0];
    if (f) setImageFromBlob(f);
    e.target.value = '';
  });
  $('clearImg').addEventListener('click', () => {
    image = null; $('preview').style.display = 'none'; $('previewImg').src = '';
  });
  document.addEventListener('paste', (e) => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (const it of items) {
      if (it.type && it.type.startsWith('image/')) {
        const f = it.getAsFile();
        if (f) { e.preventDefault(); setImageFromBlob(f); return; }
      }
    }
  });

  // ---------- Gemini ----------
  const PROMPT = `あなたは日本の電話番号を調べるアシスタントです。
1. 与えられたテキストまたは画像から電話番号を1つ特定してください（複数あれば最初の着信番号らしきもの）。
2. Google検索でその番号の持ち主（店舗・病院・企業・公的機関など）や、迷惑電話・詐欺の報告がないかを調べてください。番号はハイフンあり・なしの両方で検索してください。
3. 次の形式だけで、日本語で答えてください。余計な前置きは不要です。

番号: （ハイフン付きの番号。見つからなければ「なし」）
結論: （「〇〇クリニックの番号です」のような一文。わからなければ「持ち主は特定できませんでした」）
種類: （店舗 / 医療機関 / 企業 / 公的機関 / 営業電話 / 迷惑電話の可能性 / 個人 / 不明 のどれか）
確信度: （高 / 中 / 低）
詳細: （住所・業種・口コミで多い用件など、2〜4行）

注意:
- 070/080/090などの携帯番号で、事業者として公開されていない場合は、個人を特定しようとせず、迷惑電話報告の有無だけを書いてください。
- 検索で確認できないことは推測だと明記してください。`;

  async function ask(text) {
    const key = store.get('apiKey', '');
    if (!key) throw new Error('先に「設定」からGemini APIキーを保存してください。');
    const parts = [{ text: PROMPT }];
    if (text) parts.push({ text: '入力テキスト: ' + text });
    if (image) parts.push({ inline_data: { mime_type: image.mime, data: image.data } });
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(currentModel())}:generateContent`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
      body: JSON.stringify({
        contents: [{ role: 'user', parts }],
        tools: [{ google_search: {} }],
        generationConfig: { temperature: 0.2 },
      }),
    });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) {
      const msg = (json.error && json.error.message) || res.statusText;
      if (res.status === 429) throw new Error('利用上限に達しました（429）。\n無料枠でGoogle検索連携が使えない場合は、AI Studioで支払い設定を有効にすると動きます。\n\n' + msg);
      if (res.status === 400 && /api key/i.test(msg)) throw new Error('APIキーが正しくないようです。設定を確認してください。');
      throw new Error(`エラー (${res.status}): ${msg}`);
    }
    const cand = json.candidates && json.candidates[0];
    const out = ((cand && cand.content && cand.content.parts) || []).map(p => p.text || '').join('').trim();
    const chunks = (cand && cand.groundingMetadata && cand.groundingMetadata.groundingChunks) || [];
    const sources = chunks.map(c => c.web).filter(Boolean);
    return { out, sources };
  }

  function parse(out) {
    const get = (label) => {
      const m = out.match(new RegExp(label + '\\s*[:：]\\s*([\\s\\S]*?)(?=\\n(?:番号|結論|種類|確信度|詳細)\\s*[:：]|$)'));
      return m ? m[1].trim() : '';
    };
    return { number: get('番号'), summary: get('結論'), kind: get('種類'), conf: get('確信度'), detail: get('詳細') };
  }

  const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function searchLinks(num) {
    const digits = (num || '').replace(/[^\d]/g, '');
    if (!digits) return '';
    const q = encodeURIComponent(`"${num}" OR "${digits}"`);
    return `<div class="links">
      <a href="https://www.google.com/search?q=${q}" target="_blank" rel="noopener">Google</a>
      <a href="https://www.jpnumber.com/searchnumber.do?number=${digits}" target="_blank" rel="noopener">jpnumber</a>
      <a href="https://www.telnavi.jp/phone/${digits}" target="_blank" rel="noopener">電話帳ナビ</a>
    </div>`;
  }

  function render(r, sources, raw) {
    const kindClass = /迷惑|詐欺/.test(r.kind) ? 'danger' : /営業|不明|個人/.test(r.kind) ? 'warn' : '';
    const confClass = r.conf === '低' ? 'warn' : '';
    const summary = r.summary || raw || '（回答を読み取れませんでした）';
    let html = '';
    if (r.number) html += `<div class="num">${esc(r.number)}</div>`;
    html += `<div class="result-main">${esc(summary)}</div>`;
    html += '<div class="badges">';
    if (r.kind) html += `<span class="badge ${kindClass}">${esc(r.kind)}</span>`;
    if (r.conf) html += `<span class="badge ${confClass}">確信度: ${esc(r.conf)}</span>`;
    html += '</div>';
    if (r.detail) html += `<div class="detail">${esc(r.detail)}</div>`;
    if (sources.length) {
      html += '<div class="sources"><div class="muted">参照したページ</div>';
      const seen = new Set();
      for (const s of sources) {
        if (!s.uri || seen.has(s.uri)) continue; seen.add(s.uri);
        html += `<a href="${esc(s.uri)}" target="_blank" rel="noopener">🔗 ${esc(s.title || s.uri)}</a>`;
      }
      html += '</div>';
    }
    if (r.number && r.number !== 'なし') html += searchLinks(r.number);
    $('result').innerHTML = html;
  }

  // ---------- History ----------
  function loadHist() { try { return JSON.parse(store.get('hist', '[]')); } catch { return []; } }
  function saveHist(entry) {
    const h = loadHist().filter(x => x.number !== entry.number);
    h.unshift(entry);
    store.set('hist', JSON.stringify(h.slice(0, 20)));
    renderHist();
  }
  function renderHist() {
    const h = loadHist();
    $('histCard').style.display = h.length ? 'block' : 'none';
    $('hist').innerHTML = h.map(x => `<div class="hist-item"><b>${esc(x.number)}</b><br>${esc(x.summary)}</div>`).join('');
  }

  // ---------- Run ----------
  $('go').addEventListener('click', async () => {
    const text = $('input').value.trim();
    if (!text && !image) { $('input').focus(); return; }
    const btn = $('go');
    btn.disabled = true;
    $('resultCard').style.display = 'block';
    $('result').innerHTML = '<span class="spinner"></span><span class="muted">ネットで調べています…</span>';
    try {
      const { out, sources } = await ask(text);
      const r = parse(out);
      render(r, sources, out);
      if (r.number && r.number !== 'なし' && r.summary) saveHist({ number: r.number, summary: r.summary });
    } catch (e) {
      $('result').innerHTML = `<div class="err">${esc(e.message || e)}</div>`;
    } finally {
      btn.disabled = false;
    }
  });

  loadSettings();
  renderHist();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
